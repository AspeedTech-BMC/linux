%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/aspeed,rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ASPEED Always-On RTC

maintainers:
  - Tommy Huang <tommy_huang@aspeedtech.com>

description:
  The ASPEED Always-On RTC (AONRTC) is an APB-connected real-time clock
  found on ASPEED AST27xx SoCs. It is powered by a dedicated always-on
  power domain backed by an external battery (VDD_BAT), allowing the RTC
  to continue timekeeping when the main power supply (VDD_CORE) is removed.

properties:
  compatible:
    enum:
      - aspeed,ast2705-aonrtc
      - aspeed,ast2755-aonrtc

  reg:
    maxItems: 1
    description: Base address and length of the AONRTC register block.

  interrupts:
    maxItems: 1
    description:
      Single interrupt line shared by the alarm event and the battery
      switch-over event.

  resets:
    maxItems: 1
    description: Reset control for the AONRTC block in the SCU.

required:
  - compatible
  - reg
  - interrupts
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/reset/aspeed,ast2700-scu.h>

    rtc@14c01000 {
        compatible = "aspeed,ast2705-aonrtc";
        reg = <0x0 0x14c01000 0x0 0x100>;
        resets = <&syscon1 SCU1_RESET_AONRTC>;
        interrupts-extended = <&intc1_1 24>;
        status = "okay";
    };
