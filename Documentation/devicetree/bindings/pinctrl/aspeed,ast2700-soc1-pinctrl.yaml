examples:
  - |
    pinctrl1: pinctrl {
        compatible = "aspeed,ast2700-soc1-pinctrl";

        pinctrl_hvi3c0_default: hvi3c0-default {
            function = "I3C0";
            groups = "HVI3C0";
        };

        pinctrl_i3c0_3_hv_voltage: i3chv-voltage {
            pins = "U25";
            power-source = <1800>;
        };

        pinctrl_i3c0_driving: i3c0-driving {
            pins = "U25", "U26";
            drive-strength = <2>;
        };
    };
