# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/aspeed,ast2700-soc0-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ASPEED AST2700 SoC0 Pin Controller

maintainers:
  - Billy Tsai <billy_tsai@aspeedtech.com>

description: |
  Bindings for the ASPEED AST2700 SoC0 Pin Controller.

properties:
  compatible:
    const: aspeed,ast2700-soc0-pinctrl

additionalProperties:
  $ref: pinmux-node.yaml#
  additionalProperties: false

  properties:
    function:
      enum:
        - EMMC
        - VGADDC
        - USB3A
        - USB2A
        - USB3B
        - USB2B
        - JTAG0
        - PCIERC

    groups:
      enum:
        - EMMCG1
        - EMMCG4
        - EMMCG8
        - EMMCWPN
        - EMMCCDN
        - VGADDC
        - USB3AXHD
        - USB3AXHPD
        - USB3AXH
        - USB3AXHP
        - USB3AXH2B
        - USB3AXHP2B
        - USB2AXHD1
        - USB2AXHPD1
        - USB2AD1
        - USB2AXH
        - USB2AXHP
        - USB2AXH2B
        - USB2AXHP2B
        - USB2AHPD0
        - USB2AD0
        - USB2AH
        - USB2AHP
        - USB3BXHD
        - USB3BXHPD
        - USB3BXH
        - USB3BXHP
        - USB3BXH2A
        - USB3BXHP2A
        - USB2BXHD1
        - USB2BXHPD1
        - USB2BD1
        - USB2BXH
        - USB2BXHP
        - USB2BXH2A
        - USB2BXHP2A
        - USB2BHPD0
        - USB2BD0
        - USB2BH
        - USB2BHP
        - JTAGM0
        - PSP
        - SSP
        - TSP
        - DDR
        - USB3A
        - USB3B
        - PCIEA
        - PCIEB
        - PCIERC0PERST
        - PCIERC1PERST

    pins:
      $ref: /schemas/types.yaml#/definitions/string-array
    drive-strength:
      minimum: 0
      maximum: 15

allOf:
  - $ref: pinctrl.yaml#

required:
  - compatible

examples:
  - |
    pinctrl0: pinctrl{
        compatible = "aspeed,ast2700-soc0-pinctrl";

        pinctrl_emmc_default: emmc-default {
            function = "EMMC";
            groups = "EMMCG1";
        };

        pinctrl_emmcclk_driving: emmcclk-driving {
            pins = "AC14";
            drive-strength = <2>;
        };
    };
