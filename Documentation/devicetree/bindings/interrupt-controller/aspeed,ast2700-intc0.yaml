%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/aspeed,ast2700-intc0.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ASPEED AST2700 Primary Interrupt Controller (INTC0)

description: |
  The INTC0 block on the ASPEED AST2700 SoC routes external and internal
  interrupt sources to an upstream interrupt controller.

  Upstream interrupt controllers may include the ARM GIC instance used
  by the Primary Service Processor (PSP, Cortex-A35), as well as interrupt
  controllers associated with other cores such as the Secondary Service
  Processor (SSP, Cortex-M4) and the Tertiary Service Processor (TSP, Cortex-M4).
  It supports:
    - Direct INT lines
    - INT banked INT lines
    - Software interrupts (SWINT) from secondary/tertiary cores
    - Multiplexed INTM lines feeding the INTC1 controller


maintainers:
  - ryan_chen@aspeedtech.com

properties:
  compatible:
    const: aspeed,ast2700-intc0-ic

  reg:
    maxItems: 1

  interrupt-controller: true

  '#interrupt-cells':
    const: 1
    description:
      Single cell encoding the INTC0 interrupt number (hwirq).

  aspeed,interrupt-ranges:
    description: |
      Describes how ranges of parent interrupts are routed through INTC0.

      Each range is encoded as 6 cells:

        <int_pin count phandle type parent_irq flags>

      where:
        - int_pin:   First INTC0 interrupt number in this range.
        - count:     Number of consecutive INTC0 interrupts and parent
                     interrupts in this range.
        - phandle:   Phandle to the parent interrupt controller node.
        - type:      Parent interrupt type, as defined by the parent
                     interrupt controller binding (e.g. GIC_SPI).
        - parent_irq: First parent interrupt number in the range.
        - flags:     Parent interrupt flags (trigger type, etc.), as
                     defined by the parent interrupt controller binding.

      The driver only uses entries whose phandle matches the node
      referenced by interrupt-parent. The (type, parent_irq, flags)
      triplet is interpreted according to the interrupt specifier format
      of that parent controller (for GICv3 this is <type irq flags>).
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 6
    items:
      description: 6-cell range descriptors.

required:
  - '#interrupt-cells'
  - compatible
  - reg
  - interrupt-controller
  - aspeed,interrupt-ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    intc0: interrupt-controller@12100000 {
        compatible = "aspeed,ast2700-intc0-ic";
        reg = <0x12100000 0x3b00>;
        interrupt-controller;
        interrupt-parent = <&gic>;
        #interrupt-cells = <1>;

        aspeed,interrupt-ranges =
          /* Direct INT lines 0..127 routed 1:1 to GIC SPIs 0..127 */
          <0   128 &gic GIC_SPI 0   IRQ_TYPE_LEVEL_HIGH>,
          /* SWINT window: INTC0 SWINT 480..495 -> GIC SPIs 144..159 */
          <480 16  &gic GIC_SPI 144 IRQ_TYPE_LEVEL_HIGH>,
          /* INTM window feeding INTC1: INTC0 INTM 496..545 -> GIC SPIs 192..241 */
          <496 50  &gic GIC_SPI 192 IRQ_TYPE_LEVEL_HIGH>;
    };
